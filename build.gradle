buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def sharedTools = rootProject.file('gradletools.gradle')
if (sharedTools.isFile()) {
    apply from: sharedTools
} else if (project.file('../gradletools.gradle').isFile()) {
    apply from: '../gradletools.gradle'
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.2_neo/gradletools.gradle'
}

group = "com.github.mcjty"
base { archivesName = 'fancytrinkets' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repos()
at()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    jei()
    curios()
    top()
    mcjtylib()
}

publish()

modpublisher(['the-one-probe'], ['mcjtylib', 'curios'], ['the-one-probe'], ['mcjtylib', 'curios'], [])

// In-world port checks are opt-in and excluded from release builds.
if (project.hasProperty('portTests')) {
    sourceSets.main.java.srcDir 'src/portTest/java'
    extensions.getByName('runs').named('gameTestServer') {
        arguments.addAll '--test', 'fancytrinkets:*'
    }
}
if (project.hasProperty('clientSmoke')) {
    if (!project.hasProperty('portTests')) throw new GradleException('clientSmoke requires -PportTests')
    extensions.getByName('runs').named('client') {
        systemProperty 'fancytrinkets.clientSmoke', 'true'
        arguments.addAll '--quickPlaySingleplayer', 'fancytrinkets-port-smoke'
    }
}
