buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'
def sharedTools = rootProject.file('gradletools.gradle')
if (rootProject != project && sharedTools.isFile()) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkSpace/26.3_fabric/gradletools.gradle'
}

// Jenkins artifact builds; loader requirements keep the base mod versions.
ext.mcjtylib_version = '26.3-11.0.0-fabric.1'
ext.top_version = '26.3-16.0.0-fabric-1'

group = 'com.github.mcjty'
base { archivesName = 'fancytrinkets-fabric' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repos()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
mc()
config()
jei()
top()
mcjtylib()
trinkets()
loom {
    runs {
        client { client(); runDir 'run-fabric' }
        server { server(); runDir 'run-server-fabric'; programArg '--nogui' }
        if (rootProject.findProject(':workspace') == null || project.name == 'workspace' || project.hasProperty('enable_individual_runs')) {
            datagen {
                server()
                name 'Fabric Data Generation'
                vmArg '-Dfabric-api.datagen'
                vmArg '-Dfabric-api.datagen.output-dir=' + file('src/generated/resources').absolutePath
                vmArg '-Dfabric-api.datagen.modid=' + project.mod_id
                runDir 'run-data'
            }
        }
    }
}
if (rootProject.findProject(':workspace') != null && project.name != 'workspace' && !project.hasProperty('enable_individual_runs')) {
    // Loom registers default run tasks eagerly; disable them as well as removing IDE configurations.
    ['runClient', 'runServer', 'runClientRenderDoc'].each { taskName ->
        tasks.named(taskName) { enabled = false }
    }
    loom.runs.remove(loom.runs.getByName('client'))
    loom.runs.remove(loom.runs.getByName('server'))
}

modpublisher(['the-one-probe'], ['fabric-api', 'forge-config-api-port', 'mcjtylib', 'trinkets-updated'], ['the-one-probe'], ['P7dR8mSH', 'ohNO6lps', 'mcjtylib', 'XaT8sLP6'], [])

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '1000'] }
processResources {
    inputs.property 'version', project.version
    inputs.property 'portTests', project.hasProperty('portTests')
    inputs.property 'clientSmoke', project.hasProperty('clientSmoke')
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java.withSourcesJar()

publishing { publications { mavenJava(MavenPublication) { from components.java } } }

// Port checks and disposable client scenes are omitted from release artifacts.
if (project.hasProperty('portTests')) {
    dependencies { implementation fabricApi.module('fabric-gametest-api-v1', fabric_version) }
    sourceSets.main.java.srcDir 'src/portTest/java'
    loom.runs {
        gameTestServer {
            server()
            vmArg '-Dfabric-api.gametest'
            runDir 'runs/gameTestServer'
        }
    }
    processResources.doLast {
        def metadata = file("${destinationDir}/fabric.mod.json")
        def json = new groovy.json.JsonSlurper().parse(metadata)
        json.entrypoints['fabric-gametest'] = ['com.mcjty.fancytrinkets.PortTests']
        if (project.hasProperty('clientSmoke')) json.entrypoints.client.add('com.mcjty.fancytrinkets.ClientPortSmoke')
        metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}
if (project.hasProperty('clientSmoke')) {
    if (!project.hasProperty('portTests')) throw new GradleException('clientSmoke requires -PportTests')
    loom.runs.client {
        vmArg '-Dfancytrinkets.clientSmoke=true'
        programArgs '--quickPlaySingleplayer', 'fancytrinkets-port-smoke'
    }
}
